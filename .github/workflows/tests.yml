# ============================================================================
# Corre la suite de pruebas en cada Pull Request.
#
# Hoy son 67 pruebas, todas de unidad o de slice (@WebMvcTest con los
# repositorios mockeados), asi que NO necesitan base de datos. Por eso este
# workflow no levanta MySQL: seria tiempo de CI gastado al pepe.
#
# OJO cuando eso cambie. En el momento en que alguien agregue un @SpringBootTest
# o un @DataJpaTest -- que es justo lo que al proyecto le falta, porque hoy
# ninguna consulta JPQL se ejecuta jamas contra una base real -- hay que
# descomentar el bloque "services" de mas abajo.
# ============================================================================
name: Tests

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev]
  workflow_dispatch:

jobs:
  pruebas:
    name: Suite de pruebas
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------------
    # Descomentar cuando entre la primera prueba que necesite base de datos.
    # Las credenciales coinciden con las del docker-compose del proyecto.
    #
    # services:
    #   mysql:
    #     image: mysql:8.0
    #     env:
    #       MYSQL_ROOT_PASSWORD: root
    #       MYSQL_DATABASE: bodegadb
    #     ports:
    #       - 3306:3306
    #     options: >-
    #       --health-cmd="mysqladmin ping -h localhost -proot"
    #       --health-interval=10s
    #       --health-timeout=5s
    #       --health-retries=10
    # ------------------------------------------------------------------------

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Ejecutar las pruebas
        run: mvn -B test

      # Los reportes quedan disponibles aunque la corrida falle, que es
      # justamente cuando hacen falta.
      - name: Guardar los reportes de surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
