# ============================================================================
# Perfil "e2e": base desechable en memoria.
#
# Cada clase de prueba arranca con una base vacia y propia (el nombre lleva
# un numero aleatorio), se llena con lo que la prueba necesita y desaparece
# al terminar. No toca el MySQL del equipo y no hace falta Docker.
#
# POR QUE EL ESQUEMA LO GENERA HIBERNATE Y NO LOS SCRIPTS DE db/
#
# Los scripts de db/ son de MySQL y H2 no los traga: usan DROP DATABASE,
# CREATE DATABASE, USE, ALTER TABLE ... AUTO_INCREMENT = y ENGINE=InnoDB.
# Mantener una copia traducida a H2 seria peor: se desincronizaria del
# original y las pruebas pasarian sobre un esquema que no es el de produccion.
#
# Asi que aca el esquema sale de las entidades JPA (create-drop). Eso cubre
# lo que importa -- que cada consulta JPQL se ejecute de verdad contra un
# motor SQL -- pero OJO: NO verifica que las entidades sigan calzando con los
# scripts de db/. Ese chequeo lo hace ddl-auto=validate al arrancar la
# aplicacion contra MySQL, y conviene sumarlo a CI con Testcontainers.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:bodega-e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# La aplicacion trae show-sql=true; en las pruebas solo ensucia la salida.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No queremos que el application-local.properties de nadie se cuele.
spring.config.import=

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
