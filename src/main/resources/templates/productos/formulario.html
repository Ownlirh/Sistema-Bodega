<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Formulario de Producto')}"></head>
<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="contenedor">
    <h1 th:text="${producto.idProducto == null ? 'Nuevo Producto' : 'Editar Producto'}">Producto</h1>
    <p class="subtitulo">Ingrese los datos del producto para el catálogo</p>

    <div class="panel">
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{idProducto}" />
            <input type="hidden" th:field="*{estado}" />

            <div class="campo">
                <label>Código</label>
                <input type="text" th:field="*{codigo}" required>
            </div>

            <div class="campo">
                <label>Descripción</label>
                <input type="text" th:field="*{descripcion}" required>
            </div>

            <div class="campo">
                <label>Unidad de Medida</label>
                <input type="text" th:field="*{unidadMedida}" required>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="campo" style="flex: 1;">
                    <label>Precio de Compra (S/)</label>
                    <input type="number" step="0.01" th:field="*{precioCompra}" required>
                </div>
                <div class="campo" style="flex: 1;">
                    <label>Precio de Venta (S/)</label>
                    <input type="number" step="0.01" th:field="*{precioVenta}" required>
                </div>
            </div>

            <div class="campo">
                <label>Stock Mínimo</label>
                <input type="number" th:field="*{stockMinimo}" required>
            </div>

            <div class="campo">
                <label>Categoría</label>
                <select th:field="*{categoria.idCategoria}" required>
                    <option value="">-- Seleccione Categoría --</option>
                    <option th:each="cat : ${categorias}" 
                            th:value="${cat.idCategoria}" 
                            th:text="${cat.nombre}"></option>
                </select>
            </div>

            <div class="campo">
                <label>Proveedor</label>
                <select th:field="*{proveedor.idProveedor}">
                    <option value="">-- Seleccione Proveedor --</option>
                    <option th:each="prov : ${proveedores}" 
                            th:value="${prov.idProveedor}" 
                            th:text="${prov.razonSocial}"></option>
                </select>
            </div>

            <button type="submit" class="boton">Guardar Producto</button>
            <a th:href="@{/productos}" style="margin-left: 15px; text-decoration: none; color: #555;">Cancelar</a>
        </form>
    </div>
</main>

<div th:replace="~{fragments/comunes :: pie}"></div>

</body>
</html>
