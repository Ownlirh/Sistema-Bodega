<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Formulario de Tienda')}"></head>
<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="contenedor">
    <h1 th:text="${tienda.idTienda == null ? 'Nueva Tienda' : 'Editar Tienda'}">Tienda</h1>
    <p class="subtitulo">Ingrese los datos de la sucursal</p>

    <div class="panel">
        <form th:action="@{/tiendas/guardar}" th:object="${tienda}" method="post">
            <input type="hidden" th:field="*{idTienda}" />
            <input type="hidden" th:field="*{estado}" />

            <div class="campo">
                <label>Nombre de la Tienda</label>
                <input type="text" th:field="*{nombre}" maxlength="60" required>
            </div>

            <div class="campo">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" maxlength="120">
            </div>

            <div class="campo">
                <label>Distrito</label>
                <input type="text" th:field="*{distrito}" maxlength="60">
            </div>

            <div class="campo">
                <label>Teléfono</label>
                <input type="text" th:field="*{telefono}" maxlength="15">
            </div>

            <button type="submit" class="boton">Guardar Tienda</button>
            <a th:href="@{/tiendas}" style="margin-left: 15px; text-decoration: none; color: #555;">Cancelar</a>
        </form>
    </div>
</main>

<div th:replace="~{fragments/comunes :: pie}"></div>

</body>
</html>
