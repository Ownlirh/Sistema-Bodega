
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
============================================================================
FRAGMENTOS COMUNES - la base visual de todo el sistema.

Toda pantalla nueva empieza copiando la estructura de
templates/demo/productos.html, que usa estos tres fragmentos:

    <head th:replace="~{fragments/comunes :: cabecera('Titulo')}"></head>
    <div  th:replace="~{fragments/comunes :: navbar}"></div>
    <div  th:replace="~{fragments/comunes :: pie}"></div>

Asi las pantallas de los integrantes salen todas iguales.

Si agregan un modulo, sumen su enlace al navbar de abajo.
============================================================================
-->

<!-- CABECERA: recibe el titulo de la pagina -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Sistema de Bodegas'">Sistema de Bodegas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!-- NAVBAR: el menu principal -->
<div th:fragment="navbar">
    <header class="navbar">
        <a class="marca" th:href="@{/}">Sistema de Bodegas</a>

        <!--
          Los enlaces se esconden segun el rol, siguiendo la misma matriz que
          SecurityConfig. Si cambia una regla alla, hay que cambiarla aqui.

          Esconder el enlace NO es la proteccion: la proteccion real la hace
          SecurityConfig en el servidor. Esto solo evita mostrarle a alguien
          una puerta que le va a dar 403.

          Los enlaces sin sec:authorize los ve cualquiera que haya iniciado
          sesion, porque SecurityConfig los deja en anyRequest().authenticated().
        -->
        <nav>
            <a th:href="@{/}">Inicio</a>

            <!-- Integrante 5: mantenimientos y consultas -->
            <a th:href="@{/productos}">Productos</a>
            <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/empleados}">Empleados</a>
            <a th:href="@{/proveedores}">Proveedores</a>

            <!-- Integrante 2: clientes y credito -->
            <a th:href="@{/clientes}">Clientes</a>

            <a th:href="@{/consultas/ventas}">Ventas</a>

            <!-- Integrante 4: caso transaccional -->
            <a th:href="@{/venta/nueva}">Nueva venta</a>

            <!-- Integrante 6: reportes y panel -->
            <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/panel}">Panel</a>
            <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/reportes}">Reportes</a>
            <a sec:authorize="hasAnyRole('ADMINISTRADOR','MANAGER')" th:href="@{/compras}">Compras</a>
            <a sec:authorize="hasAnyRole('ADMINISTRADOR','MANAGER')" th:href="@{/gastos}">Gastos</a>
            <a sec:authorize="hasAnyRole('ADMINISTRADOR','MANAGER')" th:href="@{/vencimientos}">Vencimientos</a>
            <a sec:authorize="hasAnyRole('ADMINISTRADOR','MANAGER')" th:href="@{/mermas}">Mermas</a>

            <!-- Integrante 7: inventario y logistica -->
            <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/transferencias}">Transferencias</a>
            <a th:href="@{/kardex}">Kardex</a>
            <a sec:authorize="hasAnyRole('ADMINISTRADOR','MANAGER')" th:href="@{/ajustes}">Ajustes</a>
            <a th:href="@{/inventario/stock-bajo}">Stock bajo</a>
            <a th:href="@{/alertas}">Alertas</a>
        </nav>

        <!--
          Datos de la sesion. Vienen de SesionModelAdvice (integrante 3), que
          los deja en el modelo de todas las pantallas.
        -->
        <div class="sesion" sec:authorize="isAuthenticated()">
            <span class="sesion__nombre" th:text="${usuarioSesion}">Usuario</span>
            <span class="etiqueta" th:text="${rolSesion}">ROL</span>
            <!-- El logout va por POST: CSRF esta activo y Thymeleaf agrega el
                 token solo gracias al th:action. -->
            <form method="post" th:action="@{/logout}">
                <button class="boton boton--sutil" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </header>
</div>

<!-- PIE -->
<div th:fragment="pie">
    <footer class="pie">
        Lenguaje de Programacion II &middot; Cibertec 2026
    </footer>
</div>

</body>
</html>
