<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Ajustes de inventario por conteo fisico - integrante 7 -->
<head th:replace="~{fragments/comunes :: cabecera('Ajustes de inventario')}"></head>
<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="contenedor">

    <h1>Ajustes por conteo fisico</h1>
    <p class="subtitulo">Si lo contado en el estante no coincide con el sistema, se corrige aqui. Queda en el kardex.</p>

    <div class="aviso ok"    th:if="${ok}"    th:text="${ok}"></div>
    <div class="aviso error" th:if="${error}" th:text="${error}"></div>

    <!-- FORMULARIO -->
    <div class="panel">
        <h2 style="margin-top:0">Nuevo ajuste</h2>
        <form th:action="@{/ajustes/guardar}" method="post">

            <div class="campo">
                <label>Producto</label>
                <select name="idProducto" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="p : ${productos}" th:value="${p.idProducto}"
                            th:text="${p.codigo + ' - ' + p.descripcion}"></option>
                </select>
            </div>

            <div class="campo">
                <label>Tienda</label>
                <select name="idTienda" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="t : ${tiendas}" th:value="${t.idTienda}" th:text="${t.nombre}"></option>
                </select>
            </div>

            <div class="campo">
                <label>Cantidad contada en el estante</label>
                <input type="number" name="stockFisico" min="0" required>
            </div>

            <div class="campo">
                <label>Motivo</label>
                <input type="text" name="motivo" maxlength="150" required
                       placeholder="Ej: producto danado, error de conteo, robo">
            </div>

            <button type="submit" class="boton">Registrar ajuste</button>
        </form>
    </div>

    <!-- HISTORIAL -->
    <h2>Historial</h2>
    <div class="panel">
        <table class="datos">
            <thead>
            <tr>
                <th>#</th>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Tienda</th>
                <th class="num">Sistema</th>
                <th class="num">Contado</th>
                <th class="num">Diferencia</th>
                <th>Motivo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${ajustes}">
                <td th:text="${a.idAjuste}">1</td>
                <td th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                <td th:text="${a.producto.descripcion}">Producto</td>
                <td th:text="${a.tienda.nombre}">Tienda</td>
                <td class="num" th:text="${a.stockSistema}">0</td>
                <td class="num" th:text="${a.stockFisico}">0</td>
                <td class="num">
                    <span th:class="${a.diferencia >= 0} ? 'etiqueta ok' : 'etiqueta error'"
                          th:text="${a.diferencia > 0 ? '+' + a.diferencia : a.diferencia}">0</span>
                </td>
                <td th:text="${a.motivo}">Motivo</td>
            </tr>
            <tr th:if="${#lists.isEmpty(ajustes)}">
                <td colspan="8">Todavia no hay ajustes.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="~{fragments/comunes :: pie}"></div>

</body>
</html>
