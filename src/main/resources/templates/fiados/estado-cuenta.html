<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estado de cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Estado de cuenta del cliente</h2>
        <a th:href="@{/fiados}" class="btn btn-secondary">
            Volver a fiados
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title"
                th:text="${cliente.nombres + ' ' + cliente.apellidos}">
            </h5>

            <p class="mb-1">
                <strong>DNI:</strong>
                <span th:text="${cliente.dni}"></span>
            </p>

            <p class="mb-1">
                <strong>Teléfono:</strong>
                <span th:text="${cliente.telefono}"></span>
            </p>

            <p class="mb-0">
                <strong>Saldo total pendiente:</strong>
                <span class="text-danger fw-bold"
                      th:text="${totalPendiente}">
                </span>
            </p>
        </div>
    </div>

    <h4 class="mb-3">Historial de fiados</h4>

    <div class="alert alert-info" th:if="${#lists.isEmpty(fiados)}">
        Este cliente todavía no tiene fiados registrados.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(fiados)}">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Descripción</th>
                    <th>Monto inicial</th>
                    <th>Saldo pendiente</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fiado : ${fiados}">
                    <td th:text="${fiado.descripcion}"></td>
                    <td th:text="${fiado.montoInicial}"></td>
                    <td th:text="${fiado.saldoPendiente}"></td>
                    <td>
                        <span th:if="${fiado.estado == 'PAGADO'}"
                              class="badge bg-success">Pagado</span>
                        <span th:unless="${fiado.estado == 'PAGADO'}"
                              class="badge bg-warning text-dark">Pendiente</span>
                    </td>
                    <td>
                        <a th:href="@{/fiados/{idFiado}/pagos(idFiado=${fiado.idFiado})}"
                           class="btn btn-primary btn-sm">
                            Ver detalle y pagos
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
