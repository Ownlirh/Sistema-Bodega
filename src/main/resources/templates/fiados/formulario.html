
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/comunes :: cabecera('Nuevo fiado')}"></head>

<body>

<div th:replace="~{fragments/comunes :: navbar}"></div>

<main class="contenedor">

    <h1>Registrar nuevo fiado</h1>

    <p class="subtitulo">
        Registra una deuda pendiente asociada a un cliente.
    </p>

    <div class="aviso alerta"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/fiados/guardar}" method="post">

        <div class="campo">
            <label for="idCliente">Cliente</label>

            <select id="idCliente" name="idCliente" required>
                <option value="">Selecciona un cliente</option>

                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.idCliente}"
                        th:text="${cliente.nombres + ' ' + cliente.apellidos}"
                        th:selected="${cliente.idCliente == idClienteSeleccionado}">
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="descripcion">Descripción de la deuda</label>

            <input type="text"
                   id="descripcion"
                   name="descripcion"
                   maxlength="200"
                   placeholder="Ejemplo: compra de productos"
                   th:value="${descripcion}"
                   required>
        </div>

        <div class="campo">
            <label for="montoInicial">Monto del fiado (S/)</label>

            <input type="number"
                   id="montoInicial"
                   name="montoInicial"
                   min="0.01"
                   step="0.01"
                   placeholder="0.00"
                   th:value="${montoInicial}"
                   required>
        </div>

        <div class="acciones">
            <button type="submit" class="boton">
                Guardar fiado
            </button>

            <a class="boton" th:href="@{/fiados}">
                Cancelar
            </a>
        </div>

    </form>

</main>

<div th:replace="~{fragments/comunes :: pie}"></div>

</body>
</html>
