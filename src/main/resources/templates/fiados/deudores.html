<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes deudores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Clientes deudores</h2>
        <a th:href="@{/fiados}" class="btn btn-secondary">
            Volver a fiados
        </a>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(fiados)}">
        No hay deudas pendientes registradas.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(fiados)}">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Cliente</th>
                    <th>DNI</th>
                    <th>Descripción</th>
                    <th>Deuda inicial</th>
                    <th>Saldo pendiente</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fiado : ${fiados}">
                    <td th:text="${fiado.cliente.nombres + ' ' + fiado.cliente.apellidos}">
                    </td>
                    <td th:text="${fiado.cliente.dni}"></td>
                    <td th:text="${fiado.descripcion}"></td>
                    <td th:text="${fiado.montoInicial}"></td>
                    <td class="fw-bold text-danger"
                        th:text="${fiado.saldoPendiente}">
                    </td>
                    <td>
                        <a th:href="@{/fiados/{idFiado}/pagos(idFiado=${fiado.idFiado})}"
                           class="btn btn-primary btn-sm">
                            Ver pagos
                        </a>
                        <a th:href="@{/fiados/cliente/{idCliente}/estado-cuenta(idCliente=${fiado.cliente.idCliente})}"
                           class="btn btn-outline-secondary btn-sm">
                            Estado de cuenta
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/fiados/nuevo}" class="btn btn-success">
        Registrar nuevo fiado
    </a>
</div>

</body>
</html>
