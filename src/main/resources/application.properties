# ============================================================================
# Sistema de ventas para bodegas
#
# OJO: este archivo SE SUBE a GitHub. No pongan aqui la clave real de
# produccion. Para el despliegue en Azure usamos variables de entorno
# (ver el final del archivo).
# ============================================================================

spring.application.name=bodega-app
server.port=8080

# ----------------------------------------------------------------------------
# CONFIGURACION PERSONAL DE CADA INTEGRANTE
#
# Si tu MySQL no usa las credenciales por defecto, NO edites este archivo:
# copia application-local.properties.ejemplo a application-local.properties
# en la raiz del proyecto y pon ahi TUS datos.
#
# Ese archivo esta en .gitignore, asi que no se comparte y no genera
# conflictos. Lo que escribas ahi pisa lo de aqui abajo.
#
# optional: significa que si el archivo no existe, la aplicacion arranca
# igual con los valores por defecto.
# ----------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

# ----------------------------------------------------------------------------
# CONEXION A MYSQL (valores por defecto)
#
# Orden de prioridad, de mayor a menor:
#   1. application-local.properties  (tu archivo personal)
#   2. variables de entorno DB_USER / DB_PASSWORD
#   3. lo que dice aqui
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bodegadb?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
# Por defecto va VACIA: es lo que deja una instalacion local recien inicializada.
# Si tu root tiene clave, define DB_PASSWORD y no toques esta linea.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / HIBERNATE
#
# ddl-auto=validate es a proposito: la base la crea el script SQL, no
# Hibernate. Asi, si una entidad no coincide con su tabla, la aplicacion
# falla al arrancar con un mensaje claro en lugar de inventar columnas
# en silencio. Si necesitan ver el error exacto, arranquen con "none".
#
# NO cambiar a "update" sin avisar al grupo: deforma la base de todos.
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# THYMELEAF (vistas del integrante 4)
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----------------------------------------------------------------------------
# FORMATO
# ----------------------------------------------------------------------------
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# ----------------------------------------------------------------------------
# LOGS
# Descomentar para ver los valores que viajan en cada consulta SQL.
# Util cuando algo no guarda y no se entiende por que.
# ----------------------------------------------------------------------------
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================================
# DESPLIEGUE EN AZURE (integrante 5)
#
# No cambiar nada aqui. En el App Service, en Configuration > Application
# settings, crear estas variables y Spring las toma automaticamente:
#
#   DB_USER       usuario de la base en la nube
#   DB_PASSWORD   su clave
#   SPRING_DATASOURCE_URL   jdbc:mysql://<servidor>:3306/bodegadb?useSSL=true
#
# Los WebSockets del panel en vivo vienen DESHABILITADOS por defecto en
# Azure App Service: hay que activarlos en Configuration > General settings.
# ============================================================================
